# actionlint 1.7.12 (nixos-26.05) predates GitHub-hosted ubuntu-26.04
# runners (GA 2026-09-17). Declare the labels so the runner-label check
# accepts them. Remove once nixpkgs ships an actionlint that knows them.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
# actionlint 1.7.12 does not recognize GitHub's $/ self-repository syntax.
# Remove these ignores when https://github.com/rhysd/actionlint/issues/711 is fixed.
paths:
  .github/workflows/check.yml:
    ignore:
      - '^specifying action "\$/\.github/actions/timestamp-compare" in invalid format because ref is missing\.'
  .github/workflows/qnas.yml:
    ignore:
      - '^specifying action "\$/\.github/actions/sarif-scan" in invalid format because ref is missing\.'
