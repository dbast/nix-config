name: "QNAS"
on:
  pull_request:
    paths:
      - .github/workflows/qnas.yml
      - flake.*
      - Makefile
      - machines/base.nix
      - machines/hardware/**
      - machines/qnas.nix
      - disko/qnas.nix
      - users/**
      - secrets/qnas.yaml
      - secrets/ci.yaml
      - .sops.yaml
      - tests/qnas-*
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
permissions: {}
jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04-arm
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      pull-requests: write # Post closure diff comments on pull requests.
      security-events: write # Upload vulnxscan SARIF.
      actions: read # Download the SARIF baseline artifact from main-branch runs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect
        run: |
          lscpu
          df -h
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: true
          extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm"
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ts433
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}" # zizmor: ignore[secrets-outside-env] internal branches may write to the cache
      - name: Build qnas system
        run: |
          nix build .#nixosConfigurations.qnas.config.system.build.toplevel -o result-current
      - name: Scan qnas system
        id: sarif
        uses: ./.github/actions/sarif-scan
        with:
          sarif-location: machines/qnas.nix
          artifact: vulnxscan-sarif
          workflow-id: qnas.yml
      - name: Build base system for comparison
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p /tmp/nix-config-base
          git archive "$BASE_SHA" | tar -x -C /tmp/nix-config-base
          nix build /tmp/nix-config-base#nixosConfigurations.qnas.config.system.build.toplevel -o result-base
      - name: Generate closure diff with dix
        id: dix
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "diff<<EOF"
            nix run .#dix result-base result-current
            echo "EOF"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Post QNAS changes to PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DIX_DIFF: ${{ steps.dix.outputs.diff }}
          VULNS_DIFF: ${{ steps.sarif.outputs.diff-markdown }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- dix-diff-qnas -->';
            const { owner, repo } = context.repo;
            const parts = [
              marker,
              '## QNAS Closure Changes',
              '',
              '```',
              process.env.DIX_DIFF ?? '',
              '```',
            ];
            if (process.env.VULNS_DIFF) {
              // The tool's markdown carries its own '# Vulnerability Changes' heading.
              parts.push('', process.env.VULNS_DIFF);
            }
            const body = parts.join('\n');

            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              (comment.body?.includes(marker) || comment.body?.includes('<!-- dix-diff -->')));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
      - name: Run integration tests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          make test-qnas
      - name: Run canary end-to-end test
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }} # zizmor: ignore[secrets-outside-env] internal branches run the canary E2E test
        run: |
          test -n "$SOPS_AGE_KEY"
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SOPS_AGE_KEY" > "$key_file"
          chmod 600 "$key_file"
          unset SOPS_AGE_KEY
          SOPS_AGE_KEY_FILE="$key_file" make test-qnas-e2e
