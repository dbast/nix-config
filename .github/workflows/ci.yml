name: "CI"
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
permissions: {}
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect
        run: |
          lscpu
          df -h
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: |
          make check
      - run: |
          nix fmt -- --ci
  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: write # Post closure diff comments on pull requests.
      security-events: write # Upload vulnxscan SARIF and read accepted analyses.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect
        run: |
          lscpu
          df -h
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: true
          extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm"
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ts433
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}" # zizmor: ignore[secrets-outside-env] internal branches may write to the cache
      - name: Build qnas system
        run: |
          nix build .#nixosConfigurations.qnas.config.system.build.toplevel -o result-current
      - name: Scan qnas system
        env:
          GRYPE_DB_REQUIRE_UPDATE_CHECK: "true"
        run: |
          nix run github:tiiuae/sbomnix/45168157fdb8a9059e7acbdf9a0f24050669738f#vulnxscan -- \
            "$PWD/result-current" --require-cpe-dictionary --format sarif --sarif-location machines/qnas.nix
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: vulns.sarif
          category: vulnxscan
      - name: Build base system for comparison
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/nix-config-main
          git archive origin/main | tar -x -C /tmp/nix-config-main
          nix build /tmp/nix-config-main#nixosConfigurations.qnas.config.system.build.toplevel -o result-main
      - name: Generate closure diff with dix
        id: dix
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "diff<<EOF"
            nix run .#dix result-main result-current 2>/dev/null || echo "Error: dix command failed"
            echo "EOF"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Collect flake input timestamps
        id: flake-input-dates
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/timestamp-compare
      - name: Post changes to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DIX_DIFF: ${{ steps.dix.outputs.diff }}
          FLAKE_INPUT_DATES: ${{ steps.flake-input-dates.outputs.dates }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- dix-diff -->';
            const { owner, repo } = context.repo;
            const baseRef = `refs/heads/${context.payload.pull_request.base.ref}`;
            const { data: analyses } = await github.request(
              'GET /repos/{owner}/{repo}/code-scanning/analyses',
              { owner, repo, ref: baseRef, tool_name: 'vulnxscan', per_page: 100 },
            );
            const analysis = analyses.find(item => item.category === 'vulnxscan' && !item.error);
            if (!analysis) throw new Error(`No vulnxscan analysis found for ${baseRef}`);

            const { data } = await github.request(
              'GET /repos/{owner}/{repo}/code-scanning/analyses/{analysis_id}',
              {
                owner,
                repo,
                analysis_id: analysis.id,
                headers: { accept: 'application/sarif+json' },
              },
            );
            const baselineSarif = data instanceof ArrayBuffer
              ? JSON.parse(Buffer.from(data).toString('utf8'))
              : typeof data === 'string' ? JSON.parse(data) : data;
            if (!Array.isArray(baselineSarif.runs)) throw new Error('Invalid baseline SARIF response');
            const currentSarif = JSON.parse(fs.readFileSync('vulns.sarif', 'utf8'));
            const findings = sarif => (sarif.runs ?? []).flatMap(run => run.results ?? []);
            const keyedFindings = sarif => new Map(findings(sarif).map(result => {
              const fingerprint = result.partialFingerprints?.primaryLocationLineHash;
              if (!fingerprint) throw new Error(`Missing fingerprint for ${result.ruleId}`);
              return [fingerprint, result];
            }));
            const baseline = keyedFindings(baselineSarif);
            const current = keyedFindings(currentSarif);
            const semanticMessage = result => result.message.text.replace(/ Derivations:.*$/, '');
            const semanticFinding = result => `${result.level ?? ''}\n${semanticMessage(result)}`;
            const replacementKey = result => {
              const [, packageName, details] = result.message.text.match(/^\S+ affects (\S+) \S+\.?(.*)$/) ?? [];
              if (!packageName) throw new Error(`Unexpected finding message: ${result.message.text}`);
              return `${result.ruleId}\n${packageName}\n${result.level ?? ''}\n${details.replace(/ Derivations:.*$/, '')}`;
            };
            const exactAdded = [...current].filter(([key]) => !baseline.has(key)).map(([, result]) => result);
            const resolved = [...baseline].filter(([key]) => !current.has(key)).map(([, result]) => result);
            let carried = 0;
            const added = exactAdded.filter(result => {
              const replacement = resolved.findIndex(candidate => replacementKey(candidate) === replacementKey(result));
              if (replacement < 0) return true;
              resolved.splice(replacement, 1);
              carried += 1;
              return false;
            });
            const changed = [...current]
              .filter(([key, result]) => baseline.has(key) && semanticFinding(result) !== semanticFinding(baseline.get(key)))
              .map(([key, result]) => [baseline.get(key), result]);
            const formatFinding = result =>
              `- ${result.message.text.split(/ (?:Detected by|Fixed versions reported by scanners|Scanner fix state|Nix patch evidence|Derivations):/)[0]}`;
            const formatChanged = ([before, after]) =>
              `- **${after.ruleId}**: [${before.level}] ${semanticMessage(before)} => [${after.level}] ${semanticMessage(after)}`;
            const carriedNote = carried ? `; ${carried} persisted across package version updates` : '';
            const vulnerabilityDiff = added.length || resolved.length || changed.length
              ? [
                  `${current.size} current, ${added.length} added, ${resolved.length} resolved, ${changed.length} changed${carriedNote}.`,
                  ...(added.length ? ['', '### Added', '', ...added.map(formatFinding)] : []),
                  ...(resolved.length ? ['', '### Resolved', '', ...resolved.map(formatFinding)] : []),
                  ...(changed.length ? ['', '### Changed', '', ...changed.map(formatChanged)] : []),
                ].join('\n')
              : `No finding additions, resolutions, or detail changes (${current.size} current${carriedNote}).`;
            const body = [
              marker,
              '## NixOS Closure Changes',
              '',
              '```',
              process.env.DIX_DIFF ?? '',
              '```',
              '',
              '## Flake Input Timestamps',
              '',
              process.env.FLAKE_INPUT_DATES ?? '',
              '',
              '## Vulnerability Changes',
              '',
              vulnerabilityDiff,
            ].join('\n');

            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
      - name: Run integration tests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          make test-qnas
      - name: Run canary end-to-end test
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }} # zizmor: ignore[secrets-outside-env] internal branches run the canary E2E test
        run: |
          test -n "$SOPS_AGE_KEY"
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SOPS_AGE_KEY" > "$key_file"
          chmod 600 "$key_file"
          unset SOPS_AGE_KEY
          SOPS_AGE_KEY_FILE="$key_file" make test-qnas-e2e
