name: "CI"
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
permissions: {}
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect
        run: |
          lscpu
          df -h
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: |
          make check
      - run: |
          nix fmt -- --ci
  test:
    name: Test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: write # Post closure diff comments on pull requests.
      security-events: write # Upload vulnxscan SARIF and read accepted analyses.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect
        run: |
          lscpu
          df -h
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: true
          extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm"
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ts433
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}" # zizmor: ignore[secrets-outside-env] internal branches may write to the cache
      - name: Download previous SARIF
        id: previous-sarif
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          analysis_id="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/code-scanning/analyses" \
              -f ref="refs/heads/$BASE_REF" \
              -f tool_name=vulnxscan \
              -F per_page=100 \
              --jq 'map(select(
                (.category == "flakevuln" or .category == "vulnxscan")
                and (.error == null or .error == "")
              ))[0].id // empty'
          )"
          if [[ -n "$analysis_id" ]]; then
            path="$RUNNER_TEMP/previous-vulns.sarif"
            gh api \
              -H "Accept: application/sarif+json" \
              "repos/$GITHUB_REPOSITORY/code-scanning/analyses/$analysis_id" \
              > "$path"
            echo "path=$path" >> "$GITHUB_OUTPUT"
          fi
      - name: Build qnas system
        run: |
          nix build .#nixosConfigurations.qnas.config.system.build.toplevel -o result-current
      - name: Scan qnas system
        id: flakevuln
        uses: dbast/flakevuln@52dbc8be01047b7b4bed2fbc91b2bea20823c069
        with:
          targets: result-current
          sarif-location: machines/qnas.nix
          previous-sarif: ${{ steps.previous-sarif.outputs.path }}
      - name: Upload SARIF
        if: ${{ always() && steps.flakevuln.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ steps.flakevuln.outputs.sarif }}
          category: vulnxscan
      - name: Build base system for comparison
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/nix-config-main
          git archive origin/main | tar -x -C /tmp/nix-config-main
          nix build /tmp/nix-config-main#nixosConfigurations.qnas.config.system.build.toplevel -o result-main
      - name: Generate closure diff with dix
        id: dix
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "diff<<EOF"
            nix run .#dix result-main result-current 2>/dev/null || echo "Error: dix command failed"
            echo "EOF"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Collect flake input timestamps
        id: flake-input-dates
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/timestamp-compare
      - name: Post changes to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DIX_DIFF: ${{ steps.dix.outputs.diff }}
          FLAKE_INPUT_DATES: ${{ steps.flake-input-dates.outputs.dates }}
          VULNERABILITY_DIFF_PATH: ${{ steps.flakevuln.outputs.markdown }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- dix-diff -->';
            const { owner, repo } = context.repo;
            const vulnerabilityDiff = fs.readFileSync(
              process.env.VULNERABILITY_DIFF_PATH,
              'utf8',
            ).trim();
            const body = [
              marker,
              '## NixOS Closure Changes',
              '',
              '```',
              process.env.DIX_DIFF ?? '',
              '```',
              '',
              '## Flake Input Timestamps',
              '',
              process.env.FLAKE_INPUT_DATES ?? '',
              '',
              vulnerabilityDiff,
            ].join('\n');

            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
      - name: Run integration tests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          make test-qnas
      - name: Run canary end-to-end test
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }} # zizmor: ignore[secrets-outside-env] internal branches run the canary E2E test
        run: |
          test -n "$SOPS_AGE_KEY"
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SOPS_AGE_KEY" > "$key_file"
          chmod 600 "$key_file"
          unset SOPS_AGE_KEY
          SOPS_AGE_KEY_FILE="$key_file" make test-qnas-e2e
