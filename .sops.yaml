keys:
  - &developer 
  - &qnas 
  - &rnas 
  - &ci 
creation_rules:
  - path_regex: ^secrets/qnas\.yaml$
    key_groups:
      - age:
          - *developer
          - *qnas
  - path_regex: ^secrets/rnas\.yaml$
    key_groups:
      - age:
          - *developer
          - *rnas
  - path_regex: ^secrets/ci\.yaml$
    key_groups:
      - age:
          - *developer
          - *ci
